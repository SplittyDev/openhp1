[workspace]
members = [
    "crates/openhp1-map",
    "crates/openhp1-mesh",
    "crates/openhp1-package",
    "crates/openhp1-render",
    "crates/openhp1-scene",
    "crates/openhp1-texture",
    "crates/openhp1-viewer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
glam = "0.30"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "29"
