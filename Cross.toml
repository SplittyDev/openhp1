[target.x86_64-unknown-linux-gnu]
image = "openhp1-linux-x86_64:glibc-2.31"

[target.x86_64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig",
    "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-L native=/usr/lib/x86_64-linux-gnu -C link-arg=-Wl,-rpath-link,/usr/lib/x86_64-linux-gnu",
]

[target.aarch64-unknown-linux-gnu]
image = "openhp1-linux-aarch64:glibc-2.31"

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig",
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-L native=/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link,/usr/lib/aarch64-linux-gnu",
]
